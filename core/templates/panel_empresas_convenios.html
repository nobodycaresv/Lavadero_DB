<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosario Estética Vehicular | Empresas y convenios</title>
<style>
  /* Colores del logo */
  :root { --rojo: #d4141c; --plata: #b9b9b9; --verde: #2e9e4f; --naranja: #f5a623; --azul: #1e88e5; }
  body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; }
  header { padding: 20px 24px; border-bottom: 4px solid var(--rojo); }
  header h1 { margin: 0; font-size: 44px; font-style: italic; }
  header span { color: var(--rojo); font-style: italic; font-weight: bold; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px; }
  section { background: #151515; border-top: 4px solid var(--rojo); padding: 20px; margin-bottom: 24px; }
  h2 { margin-top: 0; font-style: italic; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  label { color: var(--plata); font-size: 14px; }
  input, select { display: block; width: 100%; margin-top: 4px; padding: 8px; box-sizing: border-box;
                  background: #000; color: #fff; border: 1px solid #444; }
  input.invalid, select.invalid { border-color: var(--rojo); box-shadow: 0 0 0 1px var(--rojo); }
  button { background: var(--rojo); color: #fff; border: 0; padding: 9px 16px; cursor: pointer; }
  button.gris { background: #444; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .acciones { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .errores { grid-column: 1 / -1; margin: 0; padding: 10px 14px; background: #2a0a0c;
             border-left: 4px solid var(--rojo); color: #ffb3b6; font-size: 14px; display: none; }
  .errores ul { margin: 0; padding-left: 18px; }
  .nota { grid-column: 1 / -1; margin: 0; padding: 10px 14px; background: #2a2208;
          border-left: 4px solid var(--naranja); color: #ffe2a3; font-size: 14px; display: none; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--plata); border-bottom: 2px solid var(--rojo); padding: 8px; }
  td { padding: 8px; border-bottom: 1px solid #2c2c2c; }
  .baja { opacity: .4; }

  /* Notificaciones por color */
  #aviso { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); max-width: 90%;
           padding: 12px 20px; display: none; color: #fff; border-left: 8px solid #fff; z-index: 10; }
  #aviso.exito  { background: var(--verde); }
  #aviso.baja   { background: var(--naranja); color: #000; border-left-color: #000; opacity: 1; }
  #aviso.editar { background: var(--azul); }
  #aviso.error  { background: var(--rojo); }
</style>
</head>
<body>
<div hidden>{% csrf_token %}</div>

<header><h1>ROSARIO <span>Estética vehicular</span></h1></header>

<main>
  <!-- ========== EMPRESAS ========== -->
  <section>
    <h2>Empresas</h2>
    <form id="form-empresa" onsubmit="guardarEmpresa(event)" novalidate>
      <input type="hidden" id="e-id">
      <label>Razón social <input id="e-razon" required></label>
      <label>CUIT (11 números, sin guiones) <input id="e-cuit" placeholder="30123456789" inputmode="numeric" maxlength="11" required></label>
      <label>Email <input id="e-email" type="email" required></label>
      <label>Teléfono (solo números) <input id="e-tel" inputmode="numeric" required></label>
      <div class="acciones">
        <button>Guardar empresa</button>
        <button type="button" class="gris" id="e-cancelar" hidden onclick="cancelarEdicionEmpresa()">Cancelar edición</button>
      </div>
      <div class="errores" id="e-errores"></div>
    </form>
    <table>
      <thead><tr><th>Razón social</th><th>CUIT</th><th>Email</th><th>Teléfono</th><th>Estado</th><th></th></tr></thead>
      <tbody id="lista-empresas"></tbody>
    </table>
  </section>

  <!-- ========== CONVENIOS ========== -->
  <section>
    <h2>Convenios</h2>
    <form id="form-convenio" onsubmit="guardarConvenio(event)" novalidate>
      <input type="hidden" id="c-id">
      <label>Empresa <select id="c-empresa" required></select></label>
      <label>Tipo de facturación <input id="c-tipo" required></label>
      <label>Condiciones <input id="c-cond" required></label>
      <div class="acciones">
        <button id="c-guardar">Guardar convenio</button>
        <button type="button" class="gris" id="c-cancelar" hidden onclick="cancelarEdicionConvenio()">Cancelar edición</button>
      </div>
      <div class="nota" id="c-sin-empresas">No hay empresas activas. Cargá o reactivá una empresa antes de crear un convenio.</div>
      <div class="errores" id="c-errores"></div>
    </form>
    <table>
      <thead><tr><th>Empresa</th><th>Facturación</th><th>Condiciones</th><th>Estado</th><th></th></tr></thead>
      <tbody id="lista-convenios"></tbody>
    </table>
  </section>
</main>

<div id="aviso"></div>

<script>
const $ = (id) => document.getElementById(id);
const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
let empresas = [], convenios = [];

// Una sola función para hablar con la API (GET, POST, PATCH)
async function pedir(url, metodo, datos) {
  let resp;
  try {
    resp = await fetch(url, {
      method: metodo,
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
      body: datos ? JSON.stringify(datos) : undefined,
    });
  } catch (e) {
    throw new Error("No se pudo conectar con el servidor. Intentá de nuevo.");
  }
  let json = {};
  try { json = await resp.json(); } catch (e) { /* respuesta sin cuerpo JSON */ }
  if (!resp.ok) {
    const msg = Object.values(json).flat().join(" ");     // errores de validación
    throw new Error(msg || `Error del servidor (${resp.status}).`);
  }
  return json;
}

// Cartel de notificación por color (se oculta a los 3 segundos)
// tipos: "exito" (verde), "baja" (naranja), "editar" (azul), "error" (rojo)
let temporizadorAviso;
function avisar(mensaje, tipo = "exito") {
  const caja = $("aviso");
  caja.textContent = mensaje;
  caja.className = tipo;
  caja.style.display = "block";
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => (caja.style.display = "none"), 3000);
}

// ---------- VALIDACIONES ----------
const REGEX_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const REGEX_CUIT = /^\d{11}$/;
const REGEX_TEL = /^\d{6,}$/;

// Muestra los errores debajo del formulario, marca los campos y avisa en rojo
function mostrarErrores(contenedor, errores) {
  $(contenedor).innerHTML = "<ul>" + errores.map((e) => `<li>${e.mensaje}</li>`).join("") + "</ul>";
  $(contenedor).style.display = "block";
  errores.forEach((e) => $(e.campo).classList.add("invalid"));
  avisar(errores[0].mensaje, "error");
}

function limpiarErrores(formId, contenedor) {
  $(contenedor).style.display = "none";
  $(contenedor).innerHTML = "";
  $(formId).querySelectorAll(".invalid").forEach((el) => el.classList.remove("invalid"));
}

// Al escribir en un campo marcado, se le quita la marca de error
document.addEventListener("input", (ev) => ev.target.classList.remove("invalid"));

function validarEmpresa(d) {
  const errores = [];
  if (!d.razon_social) errores.push({ campo: "e-razon", mensaje: "La razón social es obligatoria (no puede quedar vacía ni solo con espacios)." });
  if (!d.cuit) errores.push({ campo: "e-cuit", mensaje: "El CUIT es obligatorio." });
  else if (!REGEX_CUIT.test(d.cuit)) errores.push({ campo: "e-cuit", mensaje: "El CUIT debe tener exactamente 11 números, sin guiones, puntos, espacios ni letras." });
  if (!d.email) errores.push({ campo: "e-email", mensaje: "El email es obligatorio." });
  else if (!REGEX_EMAIL.test(d.email)) errores.push({ campo: "e-email", mensaje: "El email no tiene un formato válido (ejemplo: nombre@empresa.com)." });
  if (!d.telefono) errores.push({ campo: "e-tel", mensaje: "El teléfono es obligatorio." });
  else if (!REGEX_TEL.test(d.telefono)) errores.push({ campo: "e-tel", mensaje: "El teléfono debe contener solo números y tener al menos 6 dígitos." });
  return errores;
}

function validarConvenio(d) {
  const errores = [];
  if (!d.empresa) errores.push({ campo: "c-empresa", mensaje: "Seleccioná una empresa activa." });
  if (!d.tipo_facturacion) errores.push({ campo: "c-tipo", mensaje: "El tipo de facturación es obligatorio (no puede quedar vacío ni solo con espacios)." });
  if (!d.condiciones) errores.push({ campo: "c-cond", mensaje: "Las condiciones son obligatorias (no pueden quedar vacías ni solo con espacios)." });
  return errores;
}

// ---------- EMPRESAS ----------
async function listarEmpresas() {                       // CONSULTA
  empresas = await pedir("/api/empresas", "GET");
  $("lista-empresas").innerHTML = empresas.map((e) => `
    <tr class="${e.activo ? "" : "baja"}">
      <td>${e.razon_social}</td><td>${e.cuit}</td><td>${e.email}</td><td>${e.telefono}</td>
      <td>${e.activo ? "Activa" : "De baja"}</td>
      <td>
        <button class="gris" ${e.activo ? "" : "disabled title='La empresa está dada de baja'"} onclick="editarEmpresa(${e.id_empresa})">Editar</button>
        <button ${e.activo ? "" : "disabled title='La empresa ya está dada de baja'"} onclick="bajaEmpresa(${e.id_empresa})">Dar de baja</button>
      </td>
    </tr>`).join("");

  // El select de convenios solo muestra empresas activas
  const activas = empresas.filter((e) => e.activo);
  const seleccionada = $("c-empresa").value;
  if (activas.length) {
    $("c-empresa").innerHTML = activas
      .map((e) => `<option value="${e.id_empresa}">${e.razon_social}</option>`).join("");
    if (activas.some((e) => String(e.id_empresa) === seleccionada)) $("c-empresa").value = seleccionada;
  } else {
    $("c-empresa").innerHTML = `<option value="">Sin empresas activas</option>`;
  }
  // Sin empresas activas no se pueden crear convenios
  $("c-empresa").disabled = !activas.length;
  $("c-guardar").disabled = !activas.length;
  $("c-sin-empresas").style.display = activas.length ? "none" : "block";
}

async function guardarEmpresa(ev) {                     // ALTA y MODIFICACIÓN
  ev.preventDefault();
  limpiarErrores("form-empresa", "e-errores");
  const id = $("e-id").value;
  const datos = { razon_social: $("e-razon").value.trim(), cuit: $("e-cuit").value.trim(),
                  email: $("e-email").value.trim(), telefono: $("e-tel").value.trim() };
  const errores = validarEmpresa(datos);
  if (errores.length) { mostrarErrores("e-errores", errores); return; }
  try {
    await pedir(id ? `/api/empresas/${id}` : "/api/empresas", id ? "PATCH" : "POST", datos);
    avisar(id ? "Empresa modificada correctamente" : "Empresa guardada correctamente", "exito");
    cancelarEdicionEmpresa(false);
    await listarEmpresas();
  } catch (error) { avisar(error.message, "error"); }
}

function editarEmpresa(id) {                            // carga el formulario para modificar
  const e = empresas.find((x) => x.id_empresa === id);
  if (!e || !e.activo) { avisar("No se puede editar una empresa dada de baja", "error"); return; }
  limpiarErrores("form-empresa", "e-errores");
  $("e-id").value = id; $("e-razon").value = e.razon_social; $("e-cuit").value = e.cuit;
  $("e-email").value = e.email; $("e-tel").value = e.telefono;
  $("e-cancelar").hidden = false;
  avisar(`Editando empresa: ${e.razon_social}`, "editar");
}

function cancelarEdicionEmpresa(mostrarAviso = true) {
  const estabaEditando = $("e-id").value !== "";
  $("form-empresa").reset();
  $("e-id").value = "";
  $("e-cancelar").hidden = true;
  limpiarErrores("form-empresa", "e-errores");
  if (mostrarAviso && estabaEditando) avisar("Edición de empresa cancelada", "editar");
}

async function bajaEmpresa(id) {                        // BAJA (lógica: activo = false)
  const e = empresas.find((x) => x.id_empresa === id);
  if (!e || !e.activo) { avisar("La empresa ya está dada de baja", "error"); return; }
  if (!confirm(`¿Seguro que querés dar de baja a la empresa "${e.razon_social}"?`)) return;
  try {
    await pedir(`/api/empresas/${id}/desactivar`, "PATCH");
    if ($("e-id").value === String(id)) cancelarEdicionEmpresa(false);
    avisar("Empresa dada de baja", "baja");
    await listarEmpresas(); await listarConvenios();
  } catch (error) { avisar(error.message, "error"); }
}

// ---------- CONVENIOS ----------
async function listarConvenios() {                      // CONSULTA
  convenios = await pedir("/api/convenios", "GET");
  const nombre = (id) => empresas.find((e) => e.id_empresa === id)?.razon_social;
  $("lista-convenios").innerHTML = convenios.map((c) => `
    <tr class="${c.activo ? "" : "baja"}">
      <td>${nombre(c.empresa)}</td><td>${c.tipo_facturacion}</td><td>${c.condiciones}</td>
      <td>${c.activo ? "Activo" : "De baja"}</td>
      <td>
        <button class="gris" ${c.activo ? "" : "disabled title='El convenio está dado de baja'"} onclick="editarConvenio(${c.id_convenio})">Editar</button>
        <button ${c.activo ? "" : "disabled title='El convenio ya está dado de baja'"} onclick="bajaConvenio(${c.id_convenio})">Dar de baja</button>
      </td>
    </tr>`).join("");
}

async function guardarConvenio(ev) {                    // ALTA y MODIFICACIÓN
  ev.preventDefault();
  limpiarErrores("form-convenio", "c-errores");
  if (!empresas.some((e) => e.activo)) {
    avisar("No hay empresas activas: no se puede guardar un convenio", "error");
    return;
  }
  const id = $("c-id").value;
  const datos = { empresa: $("c-empresa").value, tipo_facturacion: $("c-tipo").value.trim(),
                  condiciones: $("c-cond").value.trim() };
  const errores = validarConvenio(datos);
  if (errores.length) { mostrarErrores("c-errores", errores); return; }
  try {
    await pedir(id ? `/api/convenios/${id}` : "/api/convenios", id ? "PATCH" : "POST", datos);
    avisar(id ? "Convenio modificado correctamente" : "Convenio guardado correctamente", "exito");
    cancelarEdicionConvenio(false);
    await listarConvenios();
  } catch (error) { avisar(error.message, "error"); }
}

function editarConvenio(id) {
  const c = convenios.find((x) => x.id_convenio === id);
  if (!c || !c.activo) { avisar("No se puede editar un convenio dado de baja", "error"); return; }
  const empresa = empresas.find((e) => e.id_empresa === c.empresa);
  if (!empresa || !empresa.activo) {
    avisar("La empresa de este convenio está dada de baja: no se puede editar", "error");
    return;
  }
  limpiarErrores("form-convenio", "c-errores");
  $("c-id").value = id; $("c-empresa").value = c.empresa;
  $("c-tipo").value = c.tipo_facturacion; $("c-cond").value = c.condiciones;
  $("c-cancelar").hidden = false;
  avisar(`Editando convenio de: ${empresa.razon_social}`, "editar");
}

function cancelarEdicionConvenio(mostrarAviso = true) {
  const estabaEditando = $("c-id").value !== "";
  $("form-convenio").reset();
  $("c-id").value = "";
  $("c-cancelar").hidden = true;
  limpiarErrores("form-convenio", "c-errores");
  if (mostrarAviso && estabaEditando) avisar("Edición de convenio cancelada", "editar");
}

async function bajaConvenio(id) {                       // BAJA (lógica)
  const c = convenios.find((x) => x.id_convenio === id);
  if (!c || !c.activo) { avisar("El convenio ya está dado de baja", "error"); return; }
  const nombre = empresas.find((e) => e.id_empresa === c.empresa)?.razon_social;
  if (!confirm(`¿Seguro que querés dar de baja el convenio de "${nombre}"?`)) return;
  try {
    await pedir(`/api/convenios/${id}/desactivar`, "PATCH");
    if ($("c-id").value === String(id)) cancelarEdicionConvenio(false);
    avisar("Convenio dado de baja", "baja");
    await listarConvenios();
  } catch (error) { avisar(error.message, "error"); }
}

// Al abrir la página: primero empresas, después convenios
listarEmpresas().then(listarConvenios).catch((error) => avisar(error.message, "error"));
</script>
</body>
</html>
