{% extends "core/panel/base_panel.html" %}
{% block titulo %}Servicios{% endblock %}
{% block encabezado %}Gestión de Servicios{% endblock %}

{% block contenido %}
<div class="tarjeta">
        <form id="service-form" class="form-group">
            <input type="hidden" id="service-id">
            <input type="hidden" id="service-activo" value="true">
            <input type="text" id="nombre" placeholder="Nombre del servicio (Ej. Tratamiento Acrílico)" required>
            <input type="number" id="precio" placeholder="Precio ($)" step="0.01" required>
            <input type="number" id="duracion" placeholder="Duración (Min)" required>
            <button type="submit">Guardar</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Servicio</th>
                    <th>Duración</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="services-table-body">
            </tbody>
        </table>
</div>
{% endblock %}

{% block scripts %}
    <script>
        const API_URL = '/api/servicios';
        let serviciosCache = [];

        async function cargarServicios() {
            try {
                const res = await fetch(API_URL);
                const servicios = await res.json();
                serviciosCache = servicios.sort((a, b) => b.id_servicio - a.id_servicio);
                const tbody = document.getElementById('services-table-body');
                tbody.innerHTML = '';

                serviciosCache.forEach(s => {
                    const rowClass = s.activo ? '' : 'row-inactive';
                    const nombreEscapado = JSON.stringify(s.nombre_servicio);
                    const toggleBtn = s.activo
                        ? `<button type="button" onclick="cambiarActivo(${s.id_servicio}, false)" class="btn-delete">Eliminar</button>`
                        : `<button type="button" onclick="cambiarActivo(${s.id_servicio}, true)" class="btn-activate">Activar</button>`;

                    tbody.innerHTML += `
                        <tr class="${rowClass}">
                            <td>${s.nombre_servicio}</td>
                            <td>${s.duracion} min</td>
                            <td>$${s.precio}</td>
                            <td class="actions">
                                <button type="button" onclick="editar(${s.id_servicio}, ${nombreEscapado}, ${s.precio}, ${s.duracion}, ${s.activo})" class="btn-edit">Editar</button>
                                ${toggleBtn}
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error cargando los servicios:", error);
            }
        }

        document.getElementById('service-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('service-id').value;
            const activo = document.getElementById('service-activo').value === 'true';
            const nombre_servicio = document.getElementById('nombre').value;
            const precio = parseFloat(document.getElementById('precio').value);
            const duracion = parseInt(document.getElementById('duracion').value);

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({ nombre_servicio, precio, duracion, activo })
                });

                if (!response.ok) {
                    const errorData = await response.text();
                    avisar("Error del servidor: " + errorData, "error");
                    return;
                }

                e.target.reset();
                avisar('Servicio guardado');
                document.getElementById('service-id').value = '';
                document.getElementById('service-activo').value = 'true';
                cargarServicios();
            } catch (error) {
                avisar("Error al comunicarse con la API.", "error");
            }
        });

        async function cambiarActivo(id, nuevoEstado) {
            const servicio = serviciosCache.find(item => item.id_servicio === id);
            if (!servicio) return;

            const mensajeConfirmacion = nuevoEstado
                ? '¿Querés volver a activar este servicio para que aparezca en las vistas?'
                : '¿Querés desactivar este servicio? No se borrará de la base de datos, pero dejará de mostrarse en las vistas.';

            if (!confirm(mensajeConfirmacion)) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({ activo: nuevoEstado })
                });

                if (!response.ok) {
                    const errorData = await response.text();
                    avisar("No se pudo actualizar: " + errorData, "error");
                    return;
                }

                cargarServicios();
            } catch (error) {
                console.error(error);
                avisar("Error al comunicarse con la API.", "error");
            }
        }

        function editar(id, nombre, precio, duracion, activo) {
            document.getElementById('service-id').value = id;
            document.getElementById('service-activo').value = String(activo);
            document.getElementById('nombre').value = nombre;
            document.getElementById('precio').value = precio;
            document.getElementById('duracion').value = duracion;
        }

        cargarServicios();
    </script>
{% endblock %}
