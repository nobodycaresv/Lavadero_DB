{% extends "core/panel/base_panel.html" %}
{% block titulo %}Estados{% endblock %}
{% block encabezado %}Gestión de Estados{% endblock %}

{% block contenido %}
<div class="tarjeta">
    <form id="form" class="form-group">
        <input type="hidden" id="id">
        <select id="tipo" required>
            <option value="">Seleccionar tipo...</option>
            <option value="turno">Turno</option>
            <option value="orden">Orden</option>
            <option value="pago">Pago</option>
        </select>
        <input type="text" id="nombre" placeholder="Nombre del estado (Ej. Confirmado)" maxlength="30" required>
        <button type="submit">Guardar</button>
    </form>

    <table>
        <thead>
            <tr><th>Tipo</th><th>Nombre</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
    const API = '/api/estados';
    const $ = id => document.getElementById(id);
    let lista = [];

    async function cargar() {
        lista = (await api(API) || []).sort((a, b) => b.id_estado - a.id_estado);
        $('tabla').innerHTML = lista.map(e => `
            <tr>
                <td>${e.tipo}</td>
                <td>${e.nombre}</td>
                <td class="actions">
                    <button class="btn-edit" onclick="editar(${e.id_estado})">Editar</button>
                    <button class="btn-delete" onclick="eliminar(${e.id_estado})">Eliminar</button>
                </td>
            </tr>`).join('');
    }

    function editar(id) {
        const e = lista.find(x => x.id_estado === id);
        $('id').value = id;
        $('tipo').value = e.tipo;
        $('nombre').value = e.nombre;
    }

    async function eliminar(id) {
        if (confirm('¿Eliminar este estado?') && await api(`${API}/${id}`, 'DELETE')) {
            avisar('Estado eliminado');
            cargar();
        }
    }

    $('form').addEventListener('submit', async e => {
        e.preventDefault();
        const id = $('id').value;
        const datos = {
            tipo: $('tipo').value,
            nombre: $('nombre').value.trim()
        };
        if (!datos.tipo || !datos.nombre) {
            avisar('Completá el tipo y el nombre del estado');
            return;
        }
        if (await api(id ? `${API}/${id}` : API, id ? 'PUT' : 'POST', datos)) {
            e.target.reset();
            $('id').value = '';
            avisar('Estado guardado');
            cargar();
        }
    });

    cargar();
</script>
{% endblock %}
