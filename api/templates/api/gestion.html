<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosario Estética Vehicular - Gestión</title>
    <style>
        :root {
            --bg-black: #000000;
            --card-dark: #121212;
            --red-rosario: #BD201B;
            --red-hover: #9c1916;
            --text-white: #FFFFFF;
            --text-gray: #C8C8C8;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--red-rosario);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--text-white);
            font-size: 28px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--text-gray);
            font-size: 14px;
        }

        .card {
            background-color: var(--card-dark);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(189, 32, 27, 0.1);
        }

        h2 {
            color: var(--red-rosario);
            font-size: 20px;
            margin-top: 0;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-gray);
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #1a1a1a;
            border: 1px solid var(--red-rosario);
            border-radius: 6px;
            color: var(--text-white);
            font-size: 15px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #ff332e;
            box-shadow: 0 0 5px rgba(189, 32, 27, 0.5);
        }

        button {
            background-color: var(--red-rosario);
            color: var(--text-white);
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
            text-transform: uppercase;
        }

        button:hover {
            background-color: var(--red-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #222;
        }

        th {
            background-color: #1a1a1a;
            color: var(--red-rosario);
        }

        td {
            color: var(--text-gray);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Rosario Estética Vehicular</h1>
            <p class="subtitle">Panel de Control y Gestión - Catálogos</p>
        </header>

        <!-- Formulario para Estados -->
        <div class="card">
            <h2>Registrar Nuevo Estado</h2>
            <form id="form-estado">
                <div class="form-group">
                    <label for="tipo">Ámbito / Tipo (turno, orden, pago, caja):</label>
                    <input type="text" id="tipo" required placeholder="Ej. turno">
                </div>
                <div class="form-group">
                    <label for="nombre-estado">Nombre del Estado:</label>
                    <input type="text" id="nombre-estado" required placeholder="Ej. Confirmado">
                </div>
                <button type="submit" id="btnGuardarEstado">Guardar Estado</button>
            </form>
        </div>

        <!-- Formulario para Medios de Pago -->
        <div class="card">
            <h2>Registrar Medio de Pago</h2>
            <form id="form-pago">
                <div class="form-group">
                    <label for="nombre-pago">Nombre del Medio de Pago:</label>
                    <input type="text" id="nombre-pago" required placeholder="Ej. Transferencia Bancaria">
                </div>
                <button type="submit" id="btnGuardarPago">Guardar Medio de Pago</button>
            </form>
        </div>

        <!-- Listados rápidos -->
        <div class="card">
            <h2>Listado de Estados Actuales</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Nombre</th>
                    </tr>
                </thead>
                <tbody id="tabla-estados">
                    <tr>
                        <td colspan="3" style="text-align: center;">Panel con diseño corporativo institucional aplicado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Función para extraer el token CSRF de las cookies de Django
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const csrftoken = getCookie('csrftoken');

            // --- GUARDAR ESTADO ---
            const formEstado = document.getElementById('form-estado');
            if (formEstado) {
                formEstado.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const tipo = document.getElementById('tipo').value;
                    const nombre = document.getElementById('nombre-estado').value;

                    fetch('/api/estados/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken
                        },
                        body: JSON.stringify({ tipo: tipo, nombre: nombre })
                    })
                    .then(response => {
                        if (response.ok) {
                            alert('¡Estado guardado con éxito!');
                            location.reload();
                        } else {
                            alert('Error al guardar el estado.');
                        }
                    })
                    .catch(error => console.error('Error:', error));
                });
            }

            // --- GUARDAR MEDIO DE PAGO ---
            const formPago = document.getElementById('form-pago');
            if (formPago) {
                formPago.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const nombre = document.getElementById('nombre-pago').value;

                    fetch('/api/medios-pago/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken
                        },
                        body: JSON.stringify({ nombre: nombre })
                    })
                    .then(response => {
                        if (response.ok) {
                            alert('¡Medio de pago guardado con éxito!');
                            location.reload();
                        } else {
                            alert('Error al guardar el medio de pago.');
                        }
                    })
                    .catch(error => console.error('Error:', error));
                });
            }
        });
    </script>
</body>
</html>
