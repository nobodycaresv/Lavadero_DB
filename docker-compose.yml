# ============================================================
# docker-compose.yml base | Proyecto Django + Postgres
# ISDEM - Práctica Profesional II - Prof. Lic. Adrián Aguirre
#
# Servicios:
#   - db  -> base de datos Postgres
#   - web -> aplicación Django
# ============================================================


services:
  db:
    image: postgres:15-alpine
    container_name: lavadero_db_local
    environment:
      POSTGRES_DB: lavadero_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=tu-secret-key-super-segura
      - DJANGO_ALLOWED_HOSTS=*
      - DB_NAME=lavadero_db
      - DB_USER=postgres
      - DB_PASSWORD=tu_password_local
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: